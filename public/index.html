<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NextWork Arcade</title>
    <link rel="stylesheet" href="./fonts.css" />
    <style>
      /* Kiosk chrome: leather surround for the letterboxed 1080p scene, no cursor.

      body { margin: 0; background: #1b1918; overflow: hidden; cursor: none; }
      canvas { display: block; }
    </style>
  </head>

    <script type="module" src="./client.js"></script>
  </body>
</html>
